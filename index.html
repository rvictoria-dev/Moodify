<!doctype html>
<html>
  <head lang="en">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=width, initial-scale=1.0" />

    <title>Moodify</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <article class="mood-card">
      <header class="track-header">
        <img
          class="album-cover"
          src="Assets/album-cover.png"
          alt="Enjoy the Silence album cover"
        />
        <div class="track-info">
          <h2 class="track-title">Enjoy the Silence</h2>
          <p class="track-artist">Depeche Mode</p>
        </div>
      </header>

      <p class="mood-text">
        All I ever wanted <br />
        All I ever needed <br />
        Is here in my arms <br />
        Words are very unnecessary <br />
        They can only do harm
      </p>

      <footer class="track-footer">
        <img class="platform-icon" src="Assets/spotify-icon.svg" alt="" />
        <span class="platform-name">Spotify</span>
      </footer>
    </article>
  </body>
</html>
